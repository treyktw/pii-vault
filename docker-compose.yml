# Local Postgres for the integration tests and `make demo`.
# Schema comes from sql/, local logins from docker/initdb/. Passwords here are
# local-development placeholders, not secrets.
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local-only
      POSTGRES_DB: pii_vault
    ports:
      - "${PII_VAULT_PG_PORT:-55439}:5432"
    volumes:
      - ./sql/001_pii_vault.sql:/docker-entrypoint-initdb.d/001_pii_vault.sql:ro
      - ./docker/initdb/010_local_logins.sql:/docker-entrypoint-initdb.d/010_local_logins.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pii_vault && psql -U postgres -d pii_vault -tAc \"SELECT 1 FROM pg_roles WHERE rolname = 'pii_vault_runtime'\" | grep -q 1"]
      interval: 1s
      timeout: 3s
      retries: 60
    tmpfs:
      - /var/lib/postgresql/data
